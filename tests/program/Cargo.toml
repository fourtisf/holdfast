[package]
name = "holdfast-vault-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM integration tests: the compiled vault program against pump.fun / PumpSwap stand-ins."

[lib]
path = "src/lib.rs"

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "token_2022", "associated_token"] }
holdfast-vault = { path = "../../programs/holdfast-vault", features = ["no-entrypoint"] }
litesvm = "0.7.1"
solana-keypair = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"
solana-message = "2.4"
solana-account = "2.2"
solana-instruction = "2.3"
solana-pubkey = "2.4"
solana-clock = "2.2"
solana-program-option = "2.2"
solana-sdk-ids = "2.2"
solana-rent = "2.2"
bincode = "1.3"
serde_json = "1"
