[package]
name = "mock-pump"
version = "0.1.0"
edition = "2021"
publish = false
description = "TEST ONLY: minimal stand-in for the pump.fun program, deployed at its real address inside LiteSVM."

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_pump"

[features]
no-entrypoint = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "token_2022"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
