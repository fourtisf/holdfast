<!doctype html><html><head><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"/package/build/three.module.js","three/addons/":"/package/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { Reflector } from "three/addons/objects/Reflector.js";

const q = new URLSearchParams(location.search);
const W = Number(q.get("w") || 1600), H = Number(q.get("h") || 1600);
const coinX = 0;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 1.1;

const camera = new THREE.PerspectiveCamera(19, W / H, 0.1, 100);
camera.position.set(0, 1.62, 10);
camera.lookAt(0, 1.55, 0);

const key = new THREE.SpotLight(0xfff0d8, 70, 0, 0.45, 0.7); key.position.set(coinX - 3, 6, 6); key.target.position.set(coinX, 1.4, 0); scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xffc96b, 4.2); rim.position.set(coinX + 3, 2.5, -4); scene.add(rim);
const fill = new THREE.DirectionalLight(0x9fb4ff, 0.5); fill.position.set(-4, 2, 5); scene.add(fill);

const goldMirror = new THREE.MeshPhysicalMaterial({ color: 0xf3c866, metalness: 1, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.08 });
const goldRing = new THREE.MeshPhysicalMaterial({ color: 0xe9bf62, metalness: 1, roughness: 0.14, clearcoat: 1, clearcoatRoughness: 0.05 });
const obsidian = new THREE.MeshPhysicalMaterial({ color: 0x07080a, metalness: 0.55, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.05 });

function castleM() {
  const w = 0.11, top = 0.45, nd = 0.11;
  const p = [[-0.56,-0.45],[-0.56,top],[-0.56+w,top],[-0.56+w,top-nd],[-0.56+2*w,top-nd],[-0.56+2*w,top],[-0.23,top],[0,0.06],
             [0.23,top],[0.56-2*w,top],[0.56-2*w,top-nd],[0.56-w,top-nd],[0.56-w,top],[0.56,top],[0.56,-0.45],[0.23,-0.45],[0.23,-0.02],[0,-0.36],[-0.23,-0.02],[-0.23,-0.45]];
  const s = new THREE.Shape(); s.moveTo(...p[0]); for (const v of p.slice(1)) s.lineTo(...v); s.closePath(); return s;
}
const prof = [[0,0.055],[0.79,0.055],[0.84,0.105],[0.95,0.105],[0.985,0.09],[1,0.06],[1,-0.06],[0.985,-0.09],[0.95,-0.105],[0.84,-0.105],[0.79,-0.055],[0,-0.055]].map(([x,y]) => new THREE.Vector2(x, y));
const coinGeo = new THREE.LatheGeometry(prof, 180); coinGeo.rotateX(Math.PI / 2);
const group = new THREE.Group();
group.add(new THREE.Mesh(coinGeo, obsidian));
const emb = new THREE.Mesh(new THREE.ExtrudeGeometry(castleM(), { depth: 0.05, bevelEnabled: true, bevelThickness: 0.026, bevelSize: 0.02, bevelSegments: 6 }), goldMirror);
emb.position.z = 0.035; group.add(emb);
group.add(new THREE.Mesh(new THREE.TorusGeometry(1.32, 0.075, 64, 260), goldRing));
group.position.set(coinX, 1.55, 0);
group.rotation.set(-0.06, -0.42, 0.05);
group.scale.setScalar(0.92);
scene.add(group);

renderer.render(scene, camera);
window.__png = renderer.domElement.toDataURL("image/png");
document.title = "done";
</script></body></html>
