# Production override for a single server: Caddy terminates HTTPS for the site and the API and is the
# only service that publishes ports. The others are reachable inside the compose network only, so
# nothing else on the host can collide with them (and ports Docker publishes would bypass ufw). deploy/init.sh
# puts COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.prod.yml in .env, so a plain
# `docker compose ...` from the repository root uses both files. Paths are relative to the root.
services:
  api:
    ports: !reset []

  indexer:
    ports: !reset []

  web:
    ports: !reset []

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  caddy_data:
  caddy_config:
